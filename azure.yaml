name: niobiumagents
resourceGroup: ${AZURE_RESOURCE_GROUP}

hooks:
  preprovision:
    shell: pwsh
    run: ./infra/scripts/SetAppSettings.ps1
  postprovision:
    - shell: pwsh
      run: ./infra/scripts/SetKeyVaultSecrets.ps1
    - shell: pwsh
      run: ./infra/scripts/ClearAppSettings.ps1

infra:
  provider: bicep
  layers:
    - name: niobiumagents-infra
      path: ./infra

services:
  niobiumagents:
    project: ./src/Niobium.AI.Agent.Driver.Server
    language: csharp
    host: function
    hooks:
      prepackage:
        # Packaging runs on a separate runner from verification. Keep every solution test,
        # and provide its isolated emulator here rather than depending on another job.
        run: npm exec --yes --package=azurite@3.35.0 -- bash ../../scripts/test-packaging.sh

pipeline:
  provider: github
